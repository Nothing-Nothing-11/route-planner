<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周边探索 · TrailQuest</title>
<style>
:root{--bg:#fff;--surface:#f8fafc;--surface2:#f1f5f9;--border:#e2e8f0;--text:#0f172a;--text2:#475569;--text3:#94a3b8;--accent:#0284c7;--accent-glow:rgba(2,132,199,.2);--scenic:#3B82F6;--food:#F59E0B;--culture:#8B5CF6;--shop:#EC4899;--night:#10B981;--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lg:0 10px 25px rgba(0,0,0,.08);--shadow-xl:0 20px 50px rgba(0,0,0,.1);--radius:12px;--radius-lg:16px;--radius-sm:8px;--nav-h:60px;--transition:200ms cubic-bezier(.4,0,.2,1)}
[data-theme="dark"]{--bg:#0b1120;--surface:#111827;--surface2:#1e293b;--border:#1e293b;--text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;--accent-glow:rgba(2,132,199,.25);--shadow:0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 10px 25px rgba(0,0,0,.4);--shadow-xl:0 20px 50px rgba(0,0,0,.5)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;transition:background var(--transition),color var(--transition)}
a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;z-index:100;height:var(--nav-h);background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:32px;transition:background var(--transition),border-color var(--transition);backdrop-filter:blur(16px)}
.nav-logo{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:-.3px}
.nav-logo span{background:linear-gradient(135deg,var(--accent),#0ea5e9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav-links{display:flex;gap:2px;flex:1}
.nav-links a{padding:8px 16px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:500;color:var(--text2);transition:all var(--transition)}
.nav-links a:hover,.nav-links a:focus-visible{background:var(--surface2);color:var(--text);outline:none}
.nav-links a.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px var(--accent-glow)}
.nav-actions{display:flex;gap:8px;align-items:center}
.nav-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all var(--transition);color:var(--text)}
.nav-btn:hover{background:var(--surface2);border-color:var(--text3);transform:scale(1.05)}

.banner{position:relative;height:140px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.banner::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#0c4a6e,#0369a1,#0284c7);z-index:0}
.banner::after{content:'';position:absolute;width:60vw;height:60vw;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.25),transparent 60%);top:-20%;left:20%;z-index:0}
.banner h1{position:relative;z-index:1;font-size:28px;font-weight:700;color:#fff;letter-spacing:-.5px}

.search-bar{padding:16px 28px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap;align-items:center;transition:background var(--transition),border-color var(--transition)}
.search-bar input{padding:11px 18px;border-radius:22px;border:1.5px solid var(--border);font-size:14px;background:var(--bg);color:var(--text);outline:none;min-width:220px;flex:1;max-width:420px;transition:all var(--transition)}
.search-bar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.search-bar select{padding:11px 16px;border-radius:22px;border:1.5px solid var(--border);font-size:13px;background:var(--bg);color:var(--text);outline:none;cursor:pointer;transition:all var(--transition)}
.search-bar button{padding:11px 26px;border-radius:22px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all var(--transition);letter-spacing:-.2px}
.search-bar button:hover{transform:translateY(-1px);box-shadow:0 4px 12px var(--accent-glow)}

.radius-row{padding:10px 28px;background:var(--surface);display:flex;gap:8px;align-items:center;transition:background var(--transition)}
.radius-tag{padding:5px 16px;border-radius:16px;font-size:12px;border:1.5px solid var(--border);cursor:pointer;color:var(--text2);transition:all var(--transition);background:var(--bg);font-weight:500}
.radius-tag:hover{border-color:var(--accent);color:var(--accent)}
.radius-tag.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.main-content{display:flex;flex:1;overflow:hidden;height:calc(100vh - var(--nav-h) - 140px - 66px - 42px)}
.map-panel{flex:1;position:relative}
#mapContainer{width:100%;height:100%}
.map-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);z-index:5;transition:opacity .5s;pointer-events:none;text-align:center;padding:24px}
.map-spinner{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.result-panel{width:380px;min-width:340px;overflow-y:auto;padding:16px;background:linear-gradient(180deg,var(--surface),var(--bg));border-left:1px solid var(--border);transition:background var(--transition),border-color var(--transition)}
.result-panel::-webkit-scrollbar{width:6px}
.result-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.result-header{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:14px;padding:12px 12px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);display:flex;align-items:center;justify-content:space-between}.result-header::after{content:'AMap POI';font-size:10px;color:var(--accent);background:var(--surface2);border-radius:999px;padding:3px 8px}
.result-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;cursor:pointer;transition:all var(--transition);display:flex;gap:12px;align-items:flex-start;animation:fadeIn .3s ease-out backwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.result-card:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}.result-card.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.result-num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.result-info{flex:1;min-width:0}
.result-name{font-size:14px;font-weight:600;margin-bottom:3px}
.result-addr{font-size:11px;color:var(--text3);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result-meta{display:flex;gap:10px;font-size:11px;color:var(--text2);flex-wrap:wrap}
.result-meta span{display:flex;align-items:center;gap:3px}

.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:12px 28px;border-radius:24px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);pointer-events:none;box-shadow:var(--shadow-xl)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent-glow);outline-offset:2px}

@media(max-width:900px){
  .nav{height:auto;min-height:var(--nav-h);padding:10px 16px;gap:12px;flex-wrap:wrap}.nav-actions{margin-left:auto}.nav-links{display:flex;overflow-x:auto;order:3;width:100%;padding-bottom:6px}.nav-links a{white-space:nowrap}
  .main-content{flex-direction:column;height:auto}.map-panel{height:45vh}
  .result-panel{width:100%;min-width:unset;border-left:none;border-top:1px solid var(--border);max-height:45vh}
  .search-bar{gap:8px}.search-bar input{max-width:100%}
}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">📍 <span>TrailQuest</span></a>
  <div class="nav-links">
    <a href="index.html">首页</a><a href="planner.html">行程规划</a><a href="routes.html">热门路线</a>
    <a href="explore.html" class="active">周边探索</a><a href="qa.html">智能问答</a><a href="dashboard.html">仪表盘</a><a href="my-trips.html">我的行程</a>
  </div>
  <div class="nav-actions"><button class="nav-btn" id="themeBtn">🌓</button></div>
</nav>

<div class="banner"><h1>📍 周边探索</h1></div>

<div class="search-bar">
  <input type="text" id="poiSearch" placeholder="输入地点名称，探索周边..." onkeydown="if(event.key==='Enter')searchPoi()">
  <select id="poiType">
    <option value="050000|060000|080000|100000">🔍 全部类型</option>
    <option value="050000">🍜 餐饮美食</option><option value="060000">🛒 购物商场</option>
    <option value="080000">🏨 酒店住宿</option><option value="110000|140000">🏔️ 风景名胜</option>
    <option value="150000|160000">🚗 交通设施</option><option value="070000">🎬 休闲娱乐</option>
  </select>
  <button onclick="searchPoi()">🔍 探索周边</button>
</div>

<div class="radius-row">
  <span class="radius-tag active" onclick="setRadius(1,this)">1 km</span>
  <span class="radius-tag" onclick="setRadius(3,this)">3 km</span>
  <span class="radius-tag" onclick="setRadius(5,this)">5 km</span>
  <span class="radius-tag" onclick="setRadius(10,this)">10 km</span>
</div>

<div class="main-content">
  <div class="map-panel">
    <div id="mapContainer"></div>
    <div class="map-overlay" id="mapOverlay"><div class="map-spinner"></div><div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px">地图加载中...</div><div style="font-size:12px;color:var(--text3)">正在连接高德地图</div></div>
  </div>
  <div class="result-panel" id="resultPanel">
    <div class="result-header">搜索结果</div>
    <div id="resultList" style="color:var(--text3);font-size:13px;text-align:center;padding:40px 0">🔍 输入地名，探索周边吃喝玩乐</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
window._AMapSecurityConfig={securityJsCode:'4b919753bb76bf1f15a7b189d9e15ed8'};
</script>
<script async src="https://webapi.amap.com/maps?v=2.0&key=4afb8b97169fca14cd25a5b5b81fd00e&plugin=AMap.PlaceSearch,AMap.Geocoder,AMap.ToolBar,AMap.Scale&callback=initMap"></script>

<script>
let map,placeSearch,geocoder,currentRadius=1,searchMarkers=[],amapReady=false;
const fallbackPois={成都:[['天府广场','城市中心广场','景点',104.0668,30.6570],['人民公园','盖碗茶与市井生活','文化',104.0555,30.6604],['宽窄巷子','老成都街巷体验','文化',104.0518,30.6675],['武侯祠','三国文化景区','文化',104.0468,30.6458],['锦里古街','小吃与伴手礼街区','购物',104.0482,30.6469],['太古里','开放式商业街区','购物',104.0835,30.6546],['九眼桥','夜生活与酒吧街','夜生活',104.0896,30.6435]],西安:[['钟楼','古城中心地标','文化',108.9428,34.2615],['回民街','西安小吃街','美食',108.9413,34.2631],['古城墙','骑行与城墙景观','景点',108.9364,34.2556],['大雁塔','唐代佛塔与广场','文化',108.9606,34.2194],['兵马俑','秦文化博物馆','文化',109.2733,34.3853]],北京:[['故宫','皇家宫殿建筑群','文化',116.3972,39.9075],['景山公园','俯瞰中轴线','景点',116.3967,39.9225],['南锣鼓巷','胡同街区','购物',116.403,39.937],['三里屯','都市夜生活','夜生活',116.454,39.933]],重庆:[['解放碑','城市地标商圈','购物',106.5778,29.5583],['洪崖洞','吊脚楼夜景','景点',106.5835,29.563],['李子坝','轻轨穿楼观景台','景点',106.54,29.548],['观音桥九街','酒吧与夜生活','夜生活',106.53,29.575]],杭州:[['西湖','湖区漫游','景点',120.149,30.258],['清河坊','南宋老街','购物',120.172,30.241],['灵隐寺','禅宗寺庙','文化',120.101,30.244],['龙井村','茶园体验','景点',120.116,30.222]],大理:[['大理古城','白族古城街区','文化',100.165,25.686],['洱海','环湖骑行','景点',100.185,25.74],['喜洲古镇','白族民居与麦田','文化',100.106,25.858],['双廊古镇','海景餐厅与日落','美食',100.195,25.936]]};
const fallbackCenters={成都:[104.0668,30.6570],西安:[108.9428,34.2615],北京:[116.3972,39.9075],重庆:[106.5778,29.5583],杭州:[120.1551,30.2741],大理:[100.165,25.686]};
function guessCity(q){for(const c in fallbackPois){if(q.indexOf(c)>=0)return c;}return '成都';}
function haversine(lng1,lat1,lng2,lat2){const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function renderFallbackResults(keyword,center){const city=guessCity(keyword);const origin=center||fallbackCenters[city];const typeText=document.getElementById('poiType').selectedOptions[0].textContent.replace(/[🔍🍜🛒🏨🏔️🚗🎬]/g,'').trim();let pois=fallbackPois[city].map(p=>({raw:p,dist:haversine(origin[0],origin[1],p[3],p[4])})).filter(x=>x.dist<=currentRadius);if(typeText&&typeText!=='全部类型'){pois=pois.filter(x=>typeText.indexOf(x.raw[2])>=0||x.raw[2].indexOf(typeText.slice(0,2))>=0);}if(!pois.length){document.getElementById('resultList').innerHTML='<div style="color:var(--text3);font-size:13px;text-align:center;padding:36px 12px">当前 '+currentRadius+'km 内暂无本地备选结果，请扩大半径或更换类型。</div>';showToast(currentRadius+'km 内暂无结果');return;}document.getElementById('resultList').innerHTML='<div style="font-size:12px;color:var(--text3);margin-bottom:12px;line-height:1.6">高德地图未返回结果，已启用 '+city+' 本地推荐；当前半径 '+currentRadius+'km，已按距离筛选。</div>'+pois.map((item,i)=>{const p=item.raw;return '<div class="result-card" onclick="focusResult('+p[3]+','+p[4]+',\''+p[0]+'\')"><div class="result-num">'+(i+1)+'</div><div class="result-info"><div class="result-name">📍 '+p[0]+'</div><div class="result-addr">'+p[1]+'</div><div class="result-meta"><span>'+p[2]+'</span><span>📏 '+Math.round(item.dist*1000)+'m</span><span>本地推荐</span></div></div></div>';}).join('');showToast('已按 '+currentRadius+'km 半径筛选结果');}

function initMap(){
  amapReady=true;document.getElementById('mapOverlay').style.opacity='0';
  setTimeout(function(){const el=document.getElementById('mapOverlay');if(el)el.style.display='none';},500);
  map=new AMap.Map('mapContainer',{center:[104.0668,30.5728],zoom:12,mapStyle:'amap://styles/light',viewMode:'3D'});
  map.addControl(new AMap.ToolBar({position:{top:'12px',right:'12px'}}));
  map.addControl(new AMap.Scale({position:{bottom:'30px',left:'12px'}}));
  placeSearch=new AMap.PlaceSearch({pageSize:30,city:'全国'});
  geocoder=new AMap.Geocoder();
  const t=localStorage.getItem('tq_theme');if(t==='dark')map.setMapStyle('amap://styles/dark');
}

function setRadius(r,el){currentRadius=r;document.querySelectorAll('.radius-tag').forEach(t=>t.classList.remove('active'));el.classList.add('active');if(document.getElementById('poiSearch').value.trim())searchPoi();}

function searchPoi(){
  const kw=document.getElementById('poiSearch').value.trim(),type=document.getElementById('poiType').value;
  if(!kw){showToast('请输入地点名称');return;}
  if(!amapReady||!geocoder||!placeSearch){renderFallbackResults(kw);return;}
  geocoder.getLocation(kw,function(status,result){
    if(status==='complete'&&result.geocodes.length){
      const loc=result.geocodes[0].location;
      map.setZoomAndCenter(14,[loc.lng,loc.lat]);
      clearMarkers();
      const centerMarker=new AMap.Marker({position:[loc.lng,loc.lat],
        content:'<div style="background:#ef4444;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;border:3px solid #fff;box-shadow:0 3px 12px rgba(239,68,68,.4)">📍</div>',
        offset:new AMap.Pixel(-16,-16),zIndex:500});
      centerMarker.setMap(map);searchMarkers.push(centerMarker);
      placeSearch.setCity(result.geocodes[0].citycode||'全国');
      placeSearch.setType(type);
      const searchWord=document.getElementById('poiType').selectedOptions[0].textContent.replace(/[🔍🍜🛒🏨🏔️🚗🎬]/g,'').trim()||'景点 美食';
      placeSearch.searchNearBy(searchWord,[loc.lng,loc.lat],currentRadius*1000,function(status,result){
        if(status==='complete'&&result.poiInfo&&result.poiInfo.pois.length){
          const pois=result.poiInfo.pois;const colors=['#3B82F6','#F59E0B','#8B5CF6','#EC4899','#10B981','#EF4444','#6366F1','#14B8A6'];
          map.setFitView(null,false,[340,60,60,60]);
          document.getElementById('resultList').innerHTML=pois.map((p,i)=>'<div class="result-card" onclick="focusResult('+p.location.lng+','+p.location.lat+',\''+p.name.replace(/'/g,'\\\'')+'\')"  style="animation-delay:'+(i*0.03)+'s"><div class="result-num">'+(i+1)+'</div><div class="result-info"><div class="result-name">'+(p.type.includes('餐饮')?'🍜 ':'📍 ')+p.name+'</div><div class="result-addr">'+p.address+'</div><div class="result-meta"><span>📏 '+(p.distance?Math.round(p.distance):'?' )+'m</span>'+(p.biz_ext&&p.biz_ext.rating?'<span>⭐ '+p.biz_ext.rating+'</span>':'')+'</div></div></div>').join('');
          pois.forEach((p,i)=>{const m=new AMap.Marker({position:[p.location.lng,p.location.lat],content:'<div style="background:'+colors[i%colors.length]+';color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)">'+(i+1)+'</div>',offset:new AMap.Pixel(-12,-12),zIndex:100-i});m.setMap(map);searchMarkers.push(m);m.on('click',function(idx){return function(){map.setZoomAndCenter(16,[pois[idx].location.lng,pois[idx].location.lat]);}}(i));});
        }else{renderFallbackResults(kw,[loc.lng,loc.lat]);}
      });
    }else{renderFallbackResults(kw);}
  });
}

function focusResult(lng,lat,name){if(map&&amapReady){map.setZoomAndCenter(17,[lng,lat]);}showToast('已定位到 '+name);}
function clearMarkers(){searchMarkers.forEach(m=>m.setMap(null));searchMarkers=[];}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}

document.getElementById('themeBtn').addEventListener('click',function(){
  const html=document.documentElement,cur=html.getAttribute('data-theme'),next=cur==='dark'?'light':'dark';
  html.setAttribute('data-theme',next);document.getElementById('themeBtn').textContent=next==='dark'?'☀️':'🌓';
  if(map&&amapReady)map.setMapStyle(next==='dark'?'amap://styles/dark':'amap://styles/light');
  localStorage.setItem('tq_theme',next);
});
(function(){const t=localStorage.getItem('tq_theme');if(t){document.documentElement.setAttribute('data-theme',t);document.getElementById('themeBtn').textContent=t==='dark'?'☀️':'🌓';}})();

setTimeout(function(){if(!amapReady){document.getElementById('mapOverlay').innerHTML='<div style="font-size:48px;margin-bottom:16px">🗺️</div><div style="font-size:15px;font-weight:600;color:var(--text)">地图加载超时</div><div style="font-size:13px;color:var(--text3);margin-top:4px">请检查网络连接</div>';}},12000);
</script>
</body>
</html>
