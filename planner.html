<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行程规划 · TrailQuest</title>
<style>
:root{--bg:#fffaf3;--surface:#fff;--surface2:#fff3df;--border:#f2dfc4;--text:#23201d;--text2:#6f6254;--text3:#a89682;--accent:#ff7a1a;--accent2:#16a085;--accent-glow:rgba(255,122,26,.22);--scenic:#e67e22;--scenic-bg:rgba(230,126,34,.1);--food:#c0392b;--food-bg:rgba(192,57,43,.1);--culture:#8e44ad;--culture-bg:rgba(142,68,173,.1);--shop:#2c3e50;--shop-bg:rgba(44,62,80,.1);--night:#16a085;--night-bg:rgba(22,160,133,.1);--shadow:0 8px 24px rgba(80,48,20,.08);--shadow-lg:0 18px 46px rgba(80,48,20,.14);--radius:16px;--radius-lg:18px;--radius-sm:10px;--radius-xl:24px;--nav-h:62px;--transition:180ms ease}
[data-theme="dark"]{--bg:#17120e;--surface:#211a14;--surface2:#2d2118;--border:#443326;--text:#fff7ed;--text2:#d7c5b3;--text3:#967d67;--accent-glow:rgba(255,122,26,.28);--shadow:0 8px 24px rgba(0,0,0,.28);--shadow-lg:0 18px 46px rgba(0,0,0,.38)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;z-index:100;height:var(--nav-h);background:rgba(255,250,243,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:28px}
[data-theme="dark"] .nav{background:rgba(23,18,14,.88)}
.nav-logo{font-size:19px;font-weight:850;display:flex;align-items:center;gap:8px;letter-spacing:-.5px}
.nav-logo span{color:var(--accent)}
.nav-links{display:flex;gap:4px;flex:1}
.nav-links a{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:650;color:var(--text2);transition:all var(--transition)}
.nav-links a:hover,.nav-links a:focus-visible{background:var(--surface2);color:var(--accent);outline:none}
.nav-links a.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px var(--accent-glow)}
.nav-actions{display:flex;gap:8px;align-items:center}
.nav-add-trip{padding:8px 18px;border-radius:999px;border:2px dashed var(--border);background:transparent;color:var(--accent);font-size:13px;font-weight:750;cursor:pointer;transition:all var(--transition);white-space:nowrap}.nav-add-trip:hover{border-color:var(--accent);background:var(--surface2)}
.nav-route-switcher{display:flex;gap:4px;align-items:center;overflow-x:auto;max-width:320px}.nav-route-tab{padding:6px 13px;border-radius:999px;font-size:12px;font-weight:650;cursor:pointer;border:1.5px solid var(--border);background:transparent;color:var(--text2);white-space:nowrap;transition:all var(--transition)}.nav-route-tab:hover{background:var(--surface2)}.nav-route-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}.nav-route-del{margin-left:-6px;width:18px;height:18px;border-radius:50%;border:none;background:transparent;color:var(--text3);font-size:10px;cursor:pointer;display:none}.nav-route-tab:hover .nav-route-del{display:inline-flex;align-items:center;justify-content:center}
.nav-save{padding:8px 18px;border-radius:999px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:750;cursor:pointer;transition:all var(--transition)}
.nav-save:hover{transform:translateY(-1px);box-shadow:0 4px 12px var(--accent-glow)}
.nav-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all var(--transition);color:var(--text)}
.nav-btn:hover{background:var(--surface2);border-color:var(--text3);transform:scale(1.05)}

@keyframes bannerFloat{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(-2%,1%) scale(1.02)}50%{transform:translate(1%,-1%) scale(1.01)}75%{transform:translate(2%,2%) scale(1.03)}}
.banner{position:relative;height:220px;display:flex;align-items:center;justify-content:space-between;padding:0 56px;overflow:hidden}
.banner-bg{position:absolute;inset:0;background:linear-gradient(135deg,#ff7a1a,#ffb347 40%,#16a085);animation:bannerFloat 20s ease-in-out infinite}
.banner-spot1{position:absolute;width:60vw;height:60vw;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%);top:-30%;left:10%;animation:bannerFloat 15s ease-in-out infinite reverse}
.banner-spot2{position:absolute;width:40vw;height:40vw;border-radius:50%;background:radial-gradient(circle,rgba(22,160,133,.3),transparent 70%);top:20%;right:-10%;animation:bannerFloat 18s ease-in-out infinite}
.banner-spot3{position:absolute;width:30vw;height:30vw;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);bottom:-20%;left:40%;animation:bannerFloat 22s ease-in-out infinite}
.banner-grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:40px 40px;opacity:.5}
.banner-left{position:relative;z-index:2}
.banner-left h1{font-size:36px;font-weight:900;color:#fff;letter-spacing:-1px;line-height:1.2}
.banner-left p{color:rgba(255,255,255,.8);font-size:15px;margin-top:6px}
.weather-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;position:relative;z-index:2}.weather-chip{padding:4px 13px;border-radius:999px;background:rgba(255,255,255,.14);color:rgba(255,255,255,.9);font-size:12px;font-weight:600;white-space:nowrap}
.banner-left .city-select{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.banner-left .city-chip{padding:5px 14px;border-radius:16px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:rgba(255,255,255,.85);transition:all var(--transition)}
.banner-left .city-chip:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.5)}
.banner-left .city-chip.active{background:rgba(255,255,255,.9);color:#ff7a1a;border-color:rgba(255,255,255,.9);font-weight:700}
.banner-right{position:relative;z-index:2;display:flex;gap:14px}
.glass-badge{background:rgba(255,255,255,.12);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.2);border-radius:var(--radius-lg);padding:14px 22px;text-align:center;min-width:105px;transition:all .3s}
.glass-badge:hover{background:rgba(255,255,255,.18);transform:translateY(-2px)}
.glass-badge .val{font-size:26px;font-weight:800;color:#fff;line-height:1}
.glass-badge .lbl{font-size:11px;color:rgba(255,255,255,.65);margin-top:5px;font-weight:500;letter-spacing:.5px}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.day-tabs{display:flex;gap:0;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
.day-tab{padding:10px 28px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;border:2px solid transparent;background:transparent;color:var(--text2);transition:all var(--transition);white-space:nowrap}
.day-tab:hover{color:var(--text);background:var(--surface2)}
.day-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 12px var(--accent-glow);animation:slideUp .3s ease-out}
.main-content{display:flex;flex:1;overflow:hidden;height:calc(100vh - var(--nav-h) - 220px - 54px - 52px)}
.timeline-panel{width:42%;min-width:400px;overflow-y:auto;overflow-x:hidden;padding:24px 20px 24px 28px;background:var(--surface);border-right:1px solid var(--border)}
.timeline-panel::-webkit-scrollbar{width:6px}.timeline-panel::-webkit-scrollbar-track{background:transparent}.timeline-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.map-panel{flex:1;position:relative}
#mapContainer{width:100%;height:100%}
.map-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;transition:opacity .5s;pointer-events:none;background:var(--surface)}
.map-overlay.ready{opacity:0;transition-delay:.3s}
.map-spinner{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.map-msg-title{font-size:14px;font-weight:600;color:var(--text)}
.map-msg-desc{font-size:12px;color:var(--text3);margin-top:4px}

@keyframes cardIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
.poi-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;display:flex;gap:16px;cursor:pointer;transition:all var(--transition);position:relative;animation:cardIn .4s ease-out backwards}
.poi-card:nth-child(1){animation-delay:0s}.poi-card:nth-child(2){animation-delay:.05s}.poi-card:nth-child(3){animation-delay:.1s}.poi-card:nth-child(4){animation-delay:.15s}.poi-card:nth-child(5){animation-delay:.2s}.poi-card:nth-child(6){animation-delay:.25s}.poi-card:nth-child(7){animation-delay:.3s}
.poi-card:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateX(3px)}
.poi-card.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.poi-card .time-dot{display:flex;flex-direction:column;align-items:center;min-width:48px}
.poi-card .dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;transition:transform var(--transition)}
.poi-card:hover .dot{transform:scale(1.15)}
.poi-card .dot-line{width:2px;flex:1;min-height:14px;margin:5px 0;border-left:2px dashed var(--border);transition:border-color var(--transition)}
.poi-card:hover .dot-line{border-color:var(--accent)}
.poi-card:last-child .dot-line{display:none}
.poi-card .card-body{flex:1;min-width:0}
.poi-card .card-header{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.poi-card .card-title{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-.2px}
.poi-card .tag{font-size:10px;padding:3px 10px;border-radius:10px;font-weight:600}
.poi-card .card-time-row{display:flex;align-items:center;gap:12px;margin-bottom:6px;font-size:12px;color:var(--text3)}
.poi-card .card-desc{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:8px}
.poi-card .card-meta{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--text3);flex-wrap:wrap}
.poi-card .card-cost{color:var(--food);font-weight:700;font-size:13px}
.poi-card .card-transport{margin-top:10px;padding:10px 12px;background:var(--surface2);border-radius:var(--radius-sm);font-size:11px;color:var(--text2);display:flex;align-items:center;gap:8px}
.poi-card .card-transport strong{color:var(--accent);font-weight:600}
.dot-scenic{background:var(--scenic)}.dot-food{background:var(--food)}.dot-culture{background:var(--culture)}.dot-shop{background:var(--shop)}.dot-night{background:var(--night)}
.tag-scenic{background:var(--scenic-bg);color:var(--scenic)}.tag-food{background:var(--food-bg);color:var(--food)}.tag-culture{background:var(--culture-bg);color:var(--culture)}.tag-shop{background:var(--shop-bg);color:var(--shop)}.tag-night{background:var(--night-bg);color:var(--night)}
.transport-bar{padding:12px 28px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;gap:24px;font-size:13px;color:var(--text2)}.transport-bar .stat{display:flex;align-items:center;gap:6px;white-space:nowrap;font-weight:500}.transport-bar .stat strong{color:var(--accent);font-weight:700}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:12px 28px;border-radius:24px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);pointer-events:none;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent-glow);outline-offset:2px}
.custom-planner{padding:14px 28px;background:linear-gradient(180deg,var(--bg),var(--surface));border-bottom:1px solid var(--border);display:grid;grid-template-columns:minmax(180px,1.2fr) 110px minmax(180px,1fr) 130px auto;gap:10px;align-items:end}
.custom-field{display:flex;flex-direction:column;gap:5px;min-width:0;position:relative}.custom-field label{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.4px}.custom-field input,.custom-field select{height:42px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);padding:0 16px;font-size:13px;transition:all var(--transition)}.custom-field input:focus,.custom-field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);outline:none}.custom-submit{height:42px;border:none;border-radius:999px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;cursor:pointer;padding:0 20px;box-shadow:0 8px 20px var(--accent-glow);transition:all var(--transition)}.custom-submit:hover{transform:translateY(-1px);box-shadow:0 12px 24px var(--accent-glow)}.custom-hint{grid-column:1/-1;font-size:12px;color:var(--text3);line-height:1.5}.custom-hint strong{color:var(--accent)}
.suggest-dropdown{display:none;position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);z-index:30;max-height:200px;overflow-y:auto;padding:4px;margin-top:2px}.suggest-dropdown.show{display:block}.suggest-item{padding:9px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text)}.suggest-item:hover,.suggest-item.active{background:var(--surface2);color:var(--accent)}.suggest-item span{font-size:11px;color:var(--text3);font-weight:500;margin-left:6px}

@media(max-width:960px){
  .nav{height:auto;min-height:var(--nav-h);padding:10px 16px;gap:12px;flex-wrap:wrap}.nav-actions{margin-left:auto}.nav-links{display:flex;overflow-x:auto;order:3;width:100%;padding-bottom:6px}.nav-links a{white-space:nowrap}
  .banner{height:auto;padding:24px 20px;flex-direction:column;text-align:center;gap:16px}.banner-left h1{font-size:24px}.banner-right{gap:8px}.glass-badge{padding:10px 16px;min-width:85px}.glass-badge .val{font-size:20px}
  .day-tabs{padding:10px 16px}.day-tab{padding:8px 18px;font-size:13px}
  .custom-planner{grid-template-columns:1fr 1fr;padding:14px 16px}.custom-field:first-child,.custom-field:nth-child(3),.custom-submit,.custom-hint{grid-column:1/-1}
  .main-content{flex-direction:column;height:auto}.timeline-panel{width:100%;min-width:unset;height:50vh;border-right:none;border-bottom:1px solid var(--border);padding:16px}.map-panel{height:50vh}
}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">📍 <span>TrailQuest</span></a>
  <div class="nav-links">
    <a href="index.html">首页</a><a href="planner.html" class="active">行程规划</a><a href="routes.html">热门路线</a>
    <a href="dashboard.html">仪表盘</a><a href="my-trips.html">我的行程</a>
  </div>
  <div class="nav-route-switcher" id="routeSwitcher"></div>
  <div class="nav-actions">
    <button class="nav-add-trip" onclick="addNewTrip()" title="添加新路线">+ 新路线</button>
    <button class="nav-save" onclick="saveAllTrips()">💾 保存</button>
    <button class="nav-btn" id="themeBtn">🌓</button>
  </div>
</nav>

<div class="banner">
  <div class="banner-bg"></div><div class="banner-spot1"></div><div class="banner-spot2"></div><div class="banner-spot3"></div><div class="banner-grid"></div>
  <div class="banner-left">
    <h1 id="bannerTitle">成都 · 3日深度游</h1>
    <p id="bannerSub">天府之国 · 蜀汉文脉 · 熊猫故乡 · 美食之都</p>
    <div class="weather-row" id="weatherRow"></div>
    <div class="city-select" id="cityChips"></div>
  </div>
  <div class="banner-right" id="bannerBadges"></div>
</div>

<form class="custom-planner" id="customPlanner" onsubmit="event.preventDefault();generateCustomTrip();">
  <div class="custom-field"><label for="customDest">自定义目的地</label><input id="customDest" type="text" placeholder="例如：苏州、广州、青海湖、川西小环线" autocomplete="off" oninput="showDestSuggest(this.value)" onfocus="showDestSuggest(this.value)" onblur="setTimeout(hideDestSuggest,200)" onkeydown="if(event.key==='Enter'){hideDestSuggest();}"><div class="suggest-dropdown" id="destSuggest"></div></div>
  <div class="custom-field"><label for="customDays">天数</label><select id="customDays"><option value="1">1 天</option><option value="2">2 天</option><option value="3" selected>3 天</option><option value="4">4 天</option><option value="5">5 天</option></select></div>
  <div class="custom-field"><label for="customPrefs">偏好</label><input id="customPrefs" type="text" placeholder="历史文化、美食、自然、购物、夜生活"></div>
  <div class="custom-field"><label for="customBudget">预算/人</label><input id="customBudget" type="number" min="300" step="100" value="3000"></div>
  <button class="custom-submit" type="submit">生成行程</button>
  <div class="custom-hint">支持任意城市、区域或路线关键词。已有完整数据的城市会打开精选路线，其他目的地会生成可保存、可统计、可地图查看的自定义路线；高德可用时自动定位中心点。</div>
</form>
<div class="day-tabs" id="dayTabs"></div>
<div class="main-content">
  <div class="timeline-panel" id="timelinePanel"></div>
  <div class="map-panel">
    <div id="mapContainer"></div>
    <div class="map-overlay" id="mapOverlay"><div class="map-spinner"></div><div class="map-msg-title" id="mapMsgTitle">地图加载中...</div><div class="map-msg-desc" id="mapMsgDesc">正在连接高德地图服务</div></div>
  </div>
</div>
<div class="transport-bar" id="transportBar"></div>
<div class="toast" id="toast"></div>

<script>
const catMap={scenic:{n:'景点',c:'scenic',e:'🏔️'},food:{n:'美食',c:'food',e:'🍜'},culture:{n:'文化',c:'culture',e:'🏛️'},shop:{n:'购物',c:'shop',e:'🛍️'},night:{n:'夜生活',c:'night',e:'🌃'}};

var allTrips={};

function estimateCenter(destination){const known=[['苏州',120.5853,31.2989],['广州',113.2644,23.1291],['上海',121.4737,31.2304],['深圳',114.0579,22.5431],['南京',118.7969,32.0603],['武汉',114.3055,30.5928],['长沙',112.9388,28.2282],['青海湖',100.2421,36.8965],['川西',101.9638,30.0507],['厦门',118.0894,24.4798],['鼓浪屿',118.0678,24.4444],['桂林',110.2900,25.2736],['阳朔',110.4966,24.7785],['祁连',100.2532,38.1771],['茶卡',99.0786,36.7846],['康定',101.9638,30.0507],['新都桥',101.4961,30.0475],['四姑娘山',102.9000,31.1000],['永庆坊',113.2448,23.1131],['沙面',113.2384,23.1095],['拙政园',120.6299,31.3244],['平江路',120.6302,31.3154]];for(const k of known){if(destination.indexOf(k[0])>=0)return [k[1],k[2]];}const h=hashText(destination);return [100+(h%2400)/100,22+((h>>8)%1800)/100];}
function pickCats(prefs){const text=(prefs||'').toLowerCase();const cats=[];if(/自然|山|水|湖|海|风景|景点/.test(text))cats.push('scenic');if(/美食|吃|餐|小吃|夜宵/.test(text))cats.push('food');if(/历史|文化|博物|古|寺|艺术/.test(text))cats.push('culture');if(/购物|商业|市集|街区/.test(text))cats.push('shop');if(/夜|酒吧|live|音乐/.test(text))cats.push('night');return cats.length?cats:['culture','food','scenic','shop','night'];}

function buildCustomTrip(opts){

function normalizeTrip(raw,fallbackId){

  t.name=t.name||t.city+'行程';
  t.dayPlan=t.dayPlan||[];
  t.dayPlan.forEach(function(d,idx){d.day=d.day||idx+1;d.label=d.label||('DAY '+(idx+1));d.pois=d.pois||[];});
  t.days=t.days||t.dayPlan.length||1;
  t.totalBudget=t.totalBudget||t.dayPlan.reduce((s,d)=>s+d.pois.reduce((ss,p)=>ss+(Number(p.cost)||0),0),0);
