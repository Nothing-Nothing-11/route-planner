<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热门路线 · TrailQuest</title>
<style>
:root{--bg:#fff;--surface:#f8fafc;--surface2:#f1f5f9;--border:#e2e8f0;--text:#0f172a;--text2:#475569;--text3:#94a3b8;--accent:#0284c7;--accent-glow:rgba(2,132,199,.2);--scenic:#3B82F6;--scenic-bg:rgba(59,130,246,.1);--food:#F59E0B;--food-bg:rgba(245,158,11,.1);--culture:#8B5CF6;--culture-bg:rgba(139,92,246,.1);--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lg:0 10px 25px rgba(0,0,0,.08);--shadow-xl:0 20px 50px rgba(0,0,0,.1);--radius:12px;--radius-lg:16px;--radius-sm:8px;--nav-h:60px;--transition:200ms cubic-bezier(.4,0,.2,1)}
[data-theme="dark"]{--bg:#0b1120;--surface:#111827;--surface2:#1e293b;--border:#1e293b;--text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;--accent-glow:rgba(2,132,199,.25);--shadow:0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 10px 25px rgba(0,0,0,.4);--shadow-xl:0 20px 50px rgba(0,0,0,.5)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;transition:background var(--transition),color var(--transition)}
a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;z-index:100;height:var(--nav-h);background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:32px;transition:background var(--transition),border-color var(--transition);backdrop-filter:blur(16px)}
.nav-logo{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:-.3px}
.nav-logo span{background:linear-gradient(135deg,var(--accent),#0ea5e9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav-links{display:flex;gap:2px;flex:1}
.nav-links a{padding:8px 16px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:500;color:var(--text2);transition:all var(--transition)}
.nav-links a:hover,.nav-links a:focus-visible{background:var(--surface2);color:var(--text);outline:none}
.nav-links a.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px var(--accent-glow)}
.nav-actions{display:flex;gap:8px;align-items:center}
.nav-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all var(--transition);color:var(--text)}
.nav-btn:hover{background:var(--surface2);border-color:var(--text3);transform:scale(1.05)}

.banner{position:relative;height:140px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.banner::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#0c4a6e,#0369a1,#0284c7);z-index:0}
.banner::after{content:'';position:absolute;width:50vw;height:50vw;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.2),transparent 60%);top:-10%;right:-10%;z-index:0}
.banner h1{position:relative;z-index:1;font-size:28px;font-weight:700;color:#fff;letter-spacing:-.5px}

.filters{padding:14px 28px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--border);background:var(--surface);transition:all var(--transition)}
.filter-btn{padding:7px 18px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);font-size:13px;cursor:pointer;color:var(--text2);transition:all var(--transition);font-weight:500}
.filter-btn:hover{border-color:var(--accent);color:var(--accent)}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px var(--accent-glow)}
.filters select{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);font-size:13px;background:var(--bg);color:var(--text);outline:none;cursor:pointer}

.content{padding:32px 28px;flex:1;max-width:1200px;margin:0 auto;width:100%}
.route-count{font-size:13px;color:var(--text3);margin-bottom:20px}
.route-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:24px}
.route-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:all var(--transition);box-shadow:var(--shadow)}
.route-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px)}
.rc-img{height:180px;position:relative;overflow:hidden}
.rc-city{position:absolute;bottom:0;left:0;right:0;padding:40px 20px 16px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:24px;font-weight:700;letter-spacing:-.5px;z-index:1}
.rc-badge{position:absolute;top:14px;left:14px;padding:4px 12px;border-radius:10px;font-size:11px;font-weight:700;background:rgba(255,255,255,.9);color:#0f172a;z-index:2}
.rc-tag{position:absolute;top:14px;right:14px;padding:4px 12px;border-radius:12px;font-size:11px;font-weight:600;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);color:#fff;z-index:2}
.rc-body{padding:20px}.rc-title{font-size:16px;font-weight:600;margin-bottom:6px;letter-spacing:-.2px}
.rc-theme{font-size:13px;color:var(--accent);margin-bottom:10px}
.rc-desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:14px}
.rc-highlights{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.rc-highlights span{padding:4px 12px;border-radius:8px;font-size:11px;font-weight:500;background:var(--scenic-bg);color:var(--scenic)}
.rc-meta{display:flex;gap:20px;font-size:12px;color:var(--text3);padding-top:14px;border-top:1px solid var(--border);font-weight:500}
.rc-meta span{display:flex;align-items:center;gap:5px}
.rc-actions{display:flex;gap:10px;margin-top:14px}
.rc-actions button{flex:1;padding:11px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:all var(--transition);letter-spacing:-.2px}
.btn-use{background:var(--accent);color:#fff;border:none}.btn-use:hover{transform:translateY(-1px);box-shadow:0 4px 12px var(--accent-glow)}
.btn-fav{background:var(--surface);color:var(--text2);border:1.5px solid var(--border)}
.btn-fav:hover{background:var(--surface2)}.btn-fav.faved{color:#ef4444;border-color:#fca5a5;background:#fef2f2}

.bg-chengdu{background:linear-gradient(135deg,#0369a1,#0ea5e9)}.bg-xian{background:linear-gradient(135deg,#92400e,#d97706)}
.bg-yunnan{background:linear-gradient(135deg,#065f46,#10b981)}.bg-jiangnan{background:linear-gradient(135deg,#1e40af,#60a5fa)}
.bg-beijing{background:linear-gradient(135deg,#991b1b,#ef4444)}.bg-chongqing{background:linear-gradient(135deg,#4c1d95,#a855f7)}
.bg-guangzhou{background:linear-gradient(135deg,#155e75,#06b6d4)}.bg-xizang{background:linear-gradient(135deg,#1e3a5f,#6366f1)}
.bg-dongbei{background:linear-gradient(135deg,#0f172a,#3b82f6)}.bg-guilin{background:linear-gradient(135deg,#14532d,#22c55e)}

.footer{padding:24px 28px;border-top:1px solid var(--border);text-align:center;font-size:12px;color:var(--text3);transition:border-color var(--transition)}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:12px 28px;border-radius:24px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);pointer-events:none;box-shadow:var(--shadow-xl)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent-glow);outline-offset:2px}
@media(max-width:900px){.nav{height:auto;min-height:var(--nav-h);padding:10px 16px;gap:12px;flex-wrap:wrap}.nav-actions{margin-left:auto}.nav-links{display:flex;overflow-x:auto;order:3;width:100%;padding-bottom:6px}.nav-links a{white-space:nowrap}.content{padding:20px 16px}.filters{padding:10px 16px;gap:6px}.route-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="nav"><a href="index.html" class="nav-logo">📍 <span>TrailQuest</span></a><div class="nav-links"><a href="index.html">首页</a><a href="planner.html">行程规划</a><a href="routes.html" class="active">热门路线</a><a href="explore.html">周边探索</a><a href="qa.html">智能问答</a><a href="dashboard.html">仪表盘</a><a href="my-trips.html">我的行程</a></div><div class="nav-actions"><button class="nav-btn" id="themeBtn">🌓</button></div></nav>
<div class="banner"><h1>🔥 热门旅游路线</h1></div>
<div class="filters"><button class="filter-btn active" onclick="filterRoutes('all',this)">全部</button><button class="filter-btn" onclick="filterRoutes('文化',this)">🏛️ 文化古迹</button><button class="filter-btn" onclick="filterRoutes('自然',this)">🏔️ 自然风光</button><button class="filter-btn" onclick="filterRoutes('美食',this)">🍜 美食之旅</button><button class="filter-btn" onclick="filterRoutes('都市',this)">🌆 都市体验</button><select onchange="sortRoutes(this.value)"><option value="default">默认排序</option><option value="days-asc">天数 ↑</option><option value="budget-asc">预算 ↑</option><option value="budget-desc">预算 ↓</option></select></div>
<div class="content"><div class="route-count" id="routeCount"></div><div class="route-grid" id="routeGrid"></div></div>
<div class="footer">&copy; 2026 TrailQuest</div><div class="toast" id="toast"></div>

<script>
const allRoutes=[
  {id:'chengdu',city:'成都',name:'天府3日经典',days:3,budget:3500,theme:'文化·美食·自然·夜生活',desc:'武侯祠寻三国遗风，大熊猫基地看国宝，宽窄巷子品盖碗茶，九眼桥锦江夜游——成都的安逸与热辣。',highlights:['武侯祠','大熊猫基地','川剧变脸','火锅','九眼桥'],tags:['文化','美食','自然','都市'],bg:'bg-chengdu'},
  {id:'xian',city:'西安',name:'古都4日探秘',days:4,budget:4200,theme:'历史·古迹·美食',desc:'兵马俑震撼千年，华清池温泉水滑，回民街烟火缭绕，古城墙上骑车看落日——十三朝古都的厚重与鲜活。',highlights:['兵马俑','华清池','大雁塔','回民街','城墙'],tags:['文化','历史','美食'],bg:'bg-xian'},
  {id:'dali',city:'大理',name:'风花雪月4日',days:4,budget:3800,theme:'苍山·洱海·古城·白族扎染',desc:'苍山洱海风花雪月，大理古城慢生活，喜洲古镇麦田与周城扎染体验，把自然、民俗、美食与夜生活串成一条轻松路线。',highlights:['洱海','大理古城','喜洲古镇','苍山','周城扎染'],tags:['自然','民俗','文化'],bg:'bg-yunnan'},
  {id:'hangzhou',city:'杭州',name:'人间天堂3日',days:3,budget:3000,theme:'西湖·灵隐寺·龙井·宋城',desc:'西湖十景、灵隐禅意、龙井茶园和钱江灯光秀串联起杭州的江南审美，适合第一次到杭州的文化休闲路线。',highlights:['西湖','灵隐寺','龙井村','宋城','钱江新城'],tags:['水乡','园林','文化'],bg:'bg-jiangnan'},
  {id:'beijing',city:'北京',name:'皇城3日精华',days:3,budget:3800,theme:'故宫·长城·胡同·烤鸭',desc:'故宫红墙金瓦，八达岭长城蜿蜒如龙，南锣鼓巷寻老北京味道，全聚德烤鸭皮酥肉嫩——帝都穿越古今。',highlights:['故宫','长城','颐和园','烤鸭','798'],tags:['文化','历史','都市'],bg:'bg-beijing'},
  {id:'chongqing',city:'重庆',name:'魔幻山城3日',days:3,budget:2800,theme:'洪崖洞·轻轨·火锅·夜景',desc:'李子坝轻轨穿楼而过，洪崖洞千与千寻现实版，长江索道横跨两岸——8D魔幻城市的无穷魅力。',highlights:['洪崖洞','长江索道','磁器口','火锅','南山夜景'],tags:['都市','美食','自然'],bg:'bg-chongqing'},
];
let activeFilter='all',activeSort='default';
function renderRoutes(){
  let f=(activeFilter==='all'?allRoutes:allRoutes.filter(r=>r.tags.includes(activeFilter))).slice();
  if(activeSort==='days-asc')f.sort((a,b)=>a.days-b.days);else if(activeSort==='budget-asc')f.sort((a,b)=>a.budget-b.budget);else if(activeSort==='budget-desc')f.sort((a,b)=>b.budget-a.budget);
  const favs=JSON.parse(localStorage.getItem('tq_favs')||'[]');
  document.getElementById('routeCount').textContent='共 '+f.length+' 条路线';
  document.getElementById('routeGrid').innerHTML=f.map(r=>{
    const faved=favs.includes(r.id);
    return '<div class="route-card"><div class="rc-img '+r.bg+'"><span class="rc-badge">'+r.days+'天</span><span class="rc-tag">'+r.tags.slice(0,2).join('·')+'</span><div class="rc-city">'+r.city+'</div></div><div class="rc-body"><div class="rc-title">'+r.name+'</div><div class="rc-theme">'+r.theme+'</div><div class="rc-desc">'+r.desc+'</div><div class="rc-highlights">'+r.highlights.map(h=>'<span>'+h+'</span>').join('')+'</div><div class="rc-meta"><span>📅 '+r.days+' 天</span><span>💰 ¥'+r.budget.toLocaleString()+'</span></div><div class="rc-actions"><button class="btn-use" onclick="useRoute(\''+r.id+'\')">✈️ 一键套用</button><button class="btn-fav'+(faved?' faved':'')+'" onclick="toggleFav(\''+r.id+'\',this)">'+(faved?'♥ 已收藏':'♡ 收藏')+'</button></div></div></div>';
  }).join('');
}
function filterRoutes(tag,btn){activeFilter=tag;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderRoutes();}
function sortRoutes(v){activeSort=v;renderRoutes();}
function useRoute(id){window.location.href='planner.html?city='+encodeURIComponent(id);}
function toggleFav(id,btn){let favs=JSON.parse(localStorage.getItem('tq_favs')||'[]');if(favs.includes(id)){favs=favs.filter(x=>x!==id);btn.textContent='♡ 收藏';btn.classList.remove('faved');showToast('已取消收藏');}else{favs.push(id);btn.textContent='♥ 已收藏';btn.classList.add('faved');showToast('已加入收藏');}localStorage.setItem('tq_favs',JSON.stringify(favs));}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
document.getElementById('themeBtn').addEventListener('click',function(){const h=document.documentElement,c=h.getAttribute('data-theme'),n=c==='dark'?'light':'dark';h.setAttribute('data-theme',n);document.getElementById('themeBtn').textContent=n==='dark'?'☀️':'🌓';localStorage.setItem('tq_theme',n);});
(function(){const t=localStorage.getItem('tq_theme');if(t){document.documentElement.setAttribute('data-theme',t);document.getElementById('themeBtn').textContent=t==='dark'?'☀️':'🌓';}})();
renderRoutes();
</script>
</body>
</html>
