<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热门路线 · TrailQuest</title>
<style>
:root{--bg:#fffaf3;--surface:#fff;--surface2:#fff3df;--border:#f2dfc4;--text:#23201d;--text2:#6f6254;--text3:#a89682;--accent:#ff7a1a;--accent2:#16a085;--accent-glow:rgba(255,122,26,.22);--shadow:0 8px 24px rgba(80,48,20,.08);--shadow-lg:0 18px 46px rgba(80,48,20,.14);--radius:20px;--nav-h:62px;--transition:180ms ease}[data-theme="dark"]{--bg:#17120e;--surface:#211a14;--surface2:#2d2118;--border:#443326;--text:#fff7ed;--text2:#d7c5b3;--text3:#967d67;--accent-glow:rgba(255,122,26,.28);--shadow:0 8px 24px rgba(0,0,0,.28);--shadow-lg:0 18px 46px rgba(0,0,0,.38)}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}a{text-decoration:none;color:inherit}.nav{position:sticky;top:0;z-index:20;height:var(--nav-h);display:flex;align-items:center;gap:28px;padding:0 28px;background:rgba(255,250,243,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}[data-theme="dark"] .nav{background:rgba(23,18,14,.88)}.nav-logo{font-size:19px;font-weight:850;letter-spacing:-.5px}.nav-logo span{color:var(--accent)}.nav-links{display:flex;gap:4px;flex:1}.nav-links a{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:650;color:var(--text2);transition:all var(--transition)}.nav-links a:hover,.nav-links a.active{background:var(--surface2);color:var(--accent)}.nav-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer}.hero{max-width:1180px;margin:0 auto;padding:38px 24px 20px}.hero-card{border-radius:30px;background:linear-gradient(135deg,#ff7a1a,#ffb347 48%,#16a085);padding:38px;color:#fff;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}.hero-card::after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.22)}.hero h1{font-size:38px;line-height:1.15;font-weight:900;letter-spacing:-1px}.hero p{margin-top:10px;max-width:720px;color:rgba(255,255,255,.88)}.filters{max-width:1180px;margin:0 auto;padding:8px 24px 4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.filter-btn,.filters select{height:38px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text2);padding:0 14px;font-size:13px;font-weight:750;cursor:pointer}.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}.search-wrap{position:relative;min-width:200px}.search-wrap input{height:38px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:0 14px;font-size:13px;width:100%;outline:none}.search-wrap input:focus{border-color:var(--accent)}.suggest-dropdown{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);z-index:30;max-height:200px;overflow-y:auto;padding:4px}.suggest-dropdown.show{display:block}.suggest-item{padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text)}.suggest-item:hover,.suggest-item.active{background:var(--surface2);color:var(--accent)}.content{max-width:1180px;margin:0 auto;padding:18px 24px 44px}.route-count{font-size:13px;color:var(--text3);margin-bottom:16px}.route-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.route-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);transition:all var(--transition)}.route-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}.rc-img{height:190px;position:relative;overflow:hidden;display:flex;align-items:flex-end}
.rc-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:0;transition:opacity .4s ease}.rc-img img.loaded{opacity:1}.rc-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.62));z-index:1}.rc-city{position:relative;z-index:2;padding:16px;color:#fff;font-size:24px;font-weight:900}.rc-badge{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.94);border-radius:999px;padding:5px 11px;font-size:11px;font-weight:900;color:#2d2118;z-index:2}.rc-body{padding:16px}.rc-title{font-size:17px;font-weight:900}.rc-theme{font-size:13px;color:var(--accent);font-weight:800;margin:4px 0 8px}.rc-desc{font-size:13px;color:var(--text2);min-height:64px}.rc-highlights{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.rc-highlights span{font-size:11px;font-weight:750;background:var(--surface2);color:var(--text2);border-radius:999px;padding:4px 9px}.rc-meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text3)}.rc-meta b{color:var(--accent);font-size:14px}.rc-actions{display:grid;grid-template-columns:1fr 96px;gap:8px;margin-top:12px}.rc-actions button{border:0;border-radius:13px;padding:11px;font-weight:850;cursor:pointer}.btn-use{background:var(--accent);color:#fff}.btn-fav{background:var(--surface2);color:var(--text2)}.btn-fav.faved{color:#e11d48}.footer{text-align:center;padding:28px;color:var(--text3);font-size:12px;border-top:1px solid var(--border)}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(18px);opacity:0;background:var(--text);color:var(--bg);padding:11px 22px;border-radius:999px;font-size:13px;font-weight:800;transition:all .25s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent-glow);outline-offset:2px}@media(max-width:980px){.nav{height:auto;min-height:var(--nav-h);padding:10px 16px;flex-wrap:wrap}.nav-links{order:3;width:100%;overflow-x:auto}.route-grid{grid-template-columns:1fr 1fr}.hero h1{font-size:30px}}@media(max-width:640px){.route-grid{grid-template-columns:1fr}.hero-card{padding:28px 22px}.filters{overflow-x:auto;flex-wrap:nowrap}.filter-btn{white-space:nowrap}}
</style>
</head>
<body>
<nav class="nav"><a href="index.html" class="nav-logo">Trail<span>Quest</span></a><div class="nav-links"><a href="index.html">首页</a><a href="planner.html">行程规划</a><a href="routes.html" class="active">热门路线</a><a href="dashboard.html">仪表盘</a><a href="my-trips.html">我的行程</a></div><button class="nav-btn" id="themeBtn">🌓</button></nav>
<section class="hero"><div class="hero-card"><h1>热门路线库</h1><p>12条路线覆盖文化古迹、自然风光、美食与都市，每一条都有真实景点和玩法描述；loremflickr + picsum 双源图片。</p></div></section>
<div class="filters"><button class="filter-btn active" onclick="filterRoutes('all',this)">全部</button><button class="filter-btn" onclick="filterRoutes('文化',this)">文化古迹</button><button class="filter-btn" onclick="filterRoutes('自然',this)">自然风光</button><button class="filter-btn" onclick="filterRoutes('美食',this)">美食路线</button><button class="filter-btn" onclick="filterRoutes('海岛',this)">海岛水岸</button><button class="filter-btn" onclick="filterRoutes('都市',this)">都市周末</button><select onchange="sortRoutes(this.value)"><option value="default">默认排序</option><option value="days-asc">天数从少到多</option><option value="budget-asc">预算从低到高</option><option value="budget-desc">预算从高到低</option></select><div class="search-wrap"><input type="text" id="routeSearch" placeholder="搜索路线..." autocomplete="off" oninput="suggestRoute(this.value)" onfocus="suggestRoute(this.value)" onblur="setTimeout(()=>document.getElementById('routeSuggest').classList.remove('show'),200)" onkeydown="if(event.key==='Enter'){const v=document.getElementById('routeSearch').value.trim();if(v){const r=findRoute(v);if(r){window.location.href=targetUrl(r);}else{document.getElementById('routeSearch').value='';filterRoutes('all',document.querySelector('.filter-btn'));}}}"><div class="suggest-dropdown" id="routeSuggest"></div></div></div>
<main class="content"><div class="route-count" id="routeCount"></div><div class="route-grid" id="routeGrid"></div></main><div class="footer">&copy; 2026 TrailQuest · loremflickr + picsum 多源图片</div><div class="toast" id="toast"></div>
<script>
const grad={chengdu:'linear-gradient(135deg,#e74c3c,#f39c12)',xian:'linear-gradient(135deg,#c0392b,#d35400)',beijing:'linear-gradient(135deg,#c0392b,#f1c40f)',hangzhou:'linear-gradient(135deg,#27ae60,#1abc9c)',chongqing:'linear-gradient(135deg,#2c3e50,#e74c3c)',dali:'linear-gradient(135deg,#2980b9,#1abc9c)',guangzhou:'linear-gradient(135deg,#e67e22,#f1c40f)',xiamen:'linear-gradient(135deg,#3498db,#2ecc71)',suzhou:'linear-gradient(135deg,#27ae60,#16a085)',guilin:'linear-gradient(135deg,#1abc9c,#2ecc71)',qinghaihu:'linear-gradient(135deg,#2980b9,#9b59b6)',chuanxi:'linear-gradient(135deg,#8e44ad,#2980b9)'};
const imgTag=(id,seed)=>'<img loading="lazy" src="https://picsum.photos/seed/'+seed+'/720/460" alt="" onerror="this.onerror=null;this.src=\'https://loremflickr.com/720/460/'+id+',travel,china\'" onload="this.classList.add(\'loaded\')">';
const allRoutes=[{id:'chengdu',city:'成都',name:'天府3日烟火游',days:3,budget:3500,theme:'武侯祠·熊猫基地·宽窄巷子·火锅·川剧',desc:'看国宝啃竹子、逛三国圣地红墙竹影、宽窄巷子喝茶掏耳朵、晚上川剧变脸配九宫格火锅，三天把成都"巴适"哲学过一遍。',highlights:['大熊猫基地','武侯祠','宽窄巷子','火锅','川剧'],tags:['文化','美食','都市'],seed:'chengdu3'},{id:'xian',city:'西安',name:'古都4日探秘',days:4,budget:4200,theme:'兵马俑·华清宫·大雁塔·城墙骑行·回民街',desc:'站在八千陶俑军阵前感受大秦雄风，城墙骑行俯瞰古都中轴线，回民街从泡馍吃到柿子饼，四天读懂十三朝。',highlights:['兵马俑','古城墙','华清宫','回民街','大唐不夜城'],tags:['文化','历史','美食'],seed:'xian3'},{id:'beijing',city:'北京',name:'皇城3日精华',days:3,budget:3800,theme:'故宫·长城·颐和园·胡同·烤鸭',desc:'从天安门进入紫禁城看金銮殿，八达岭当好汉，颐和园昆明湖泛舟，晚上簋街麻小配北冰洋，烤鸭卷饼一口入魂。',highlights:['故宫','八达岭长城','颐和园','烤鸭','南锣鼓巷'],tags:['文化','历史','都市'],seed:'beijing3'},{id:'hangzhou',city:'杭州',name:'西湖3日慢游',days:3,budget:3000,theme:'西湖·灵隐寺·龙井茶园·清河坊·宋城',desc:'断桥残雪、苏堤春晓骑车环湖，灵隐寺飞来峰听梵音，龙井村品明前茶，清河坊吃定胜糕，节奏恰到好处。',highlights:['西湖','灵隐寺','龙井茶园','宋城千古情','清河坊'],tags:['自然','文化','海岛'],seed:'hangzhou3'},{id:'chongqing',city:'重庆',name:'山城3日夜景',days:3,budget:2800,theme:'洪崖洞·李子坝·长江索道·火锅·南山夜景',desc:'洪崖洞千寻同款吊脚楼、轻轨穿楼魔幻名场面、长江索道横跨两江、南山一棵树看百万夜景，麻辣火锅每天一顿不过分。',highlights:['洪崖洞','李子坝','长江索道','火锅','南山'],tags:['都市','美食','自然'],seed:'chongqing3'},{id:'dali',city:'大理',name:'洱海4日松弛游',days:4,budget:3800,theme:'苍山·洱海骑行·喜洲古镇·白族扎染·双廊',desc:'大理古城石板路晒太阳、租电动车环洱海追S弯、喜洲破酥粑粑配稻田、周城亲手做扎染，有风的地方就该这样过。',highlights:['洱海骑行','大理古城','喜洲古镇','苍山','双廊'],tags:['自然','文化'],seed:'dali3'},{id:'guangzhou',city:'广州',name:'广府3日美食线',days:3,budget:2600,theme:'早茶·沙面·永庆坊·珠江夜游·老西关',desc:'从虾饺烧麦凤爪开启早茶、陈家祠看岭南建筑瑰宝、沙面欧式街区拍照、永庆坊非遗体验，三天把"食在广州"吃到心服口服。',highlights:['沙面','陈家祠','永庆坊','珠江夜游','北京路'],tags:['美食','都市','文化'],seed:'guangzhou3'},{id:'xiamen',city:'厦门',name:'海岛3日文艺游',days:3,budget:3200,theme:'鼓浪屿·南普陀·沙坡尾·环岛路·中山路',desc:'鼓浪屿万国建筑与钢琴声、沙坡尾渔港变文创街区、环岛路骑行看海、中山路花生汤配海蛎煎，海风里度个文艺周末。',highlights:['鼓浪屿','沙坡尾','环岛路','南普陀','中山路'],tags:['海岛','文化','都市'],seed:'xiamen3'},{id:'suzhou',city:'苏州',name:'江南2日园林线',days:2,budget:1800,theme:'拙政园·平江路·山塘街·苏博·评弹',desc:'拙政园借景入画、平江路摇橹船穿桥而过、山塘街灯笼夜游、苏州博物馆贝聿铭光影，两天看尽"上有天堂下有苏杭"。',highlights:['拙政园','平江路','山塘街','苏博','评弹'],tags:['文化','海岛'],seed:'suzhou3'},{id:'guilin',city:'桂林',name:'山水4日摄影线',days:4,budget:3600,theme:'漓江竹筏·阳朔骑行·龙脊梯田·遇龙河',desc:'漓江山水如百里画廊、阳朔十里画廊骑行、龙脊梯田灌水季镜面奇观、遇龙河竹筏漂流，全程都在画里走。',highlights:['漓江','阳朔','龙脊梯田','遇龙河','兴坪'],tags:['自然'],seed:'guilin3'},{id:'qinghaihu',city:'青海湖',name:'西北5日环湖线',days:5,budget:5200,theme:'青海湖·茶卡盐湖·祁连草原·卓尔山·公路',desc:'夏天环青海湖骑行看油菜花海、茶卡盐湖天空之镜倒影、祁连草原牛羊成群、卓尔山丹霞配雪山，西北公路每帧都是壁纸。',highlights:['青海湖','茶卡盐湖','祁连草原','卓尔山','油菜花海'],tags:['自然'],seed:'qinghaihu3'},{id:'chuanxi',city:'川西',name:'川西5日小环线',days:5,budget:5600,theme:'新都桥·塔公草原·四姑娘山·藏寨·雪山',desc:'康定溜溜的城、新都桥摄影师天堂光影、塔公草原雅拉雪山做背景、四姑娘山双桥沟徒步，川西的夏天是宫崎骏的夏天。',highlights:['新都桥','塔公草原','四姑娘山','雅拉雪山','藏寨'],tags:['自然','文化'],seed:'chuanxi3'}];
let activeFilter='all',activeSort='default';function targetUrl(r){const builtIn=['chengdu','xian','beijing','hangzhou','chongqing','dali'];return builtIn.includes(r.id)?'planner.html?city='+encodeURIComponent(r.id):'planner.html?q='+encodeURIComponent(r.city+' '+r.name);}function findRoute(q){const v=q.trim().toLowerCase();return allRoutes.find(r=>r.city.toLowerCase().includes(v)||r.name.toLowerCase().includes(v)||r.highlights.some(h=>h.toLowerCase().includes(v)));}function suggestRoute(v){const d=document.getElementById('routeSuggest');if(!v){d.classList.remove('show');d.innerHTML='';return;}const q=v.trim().toLowerCase();const matches=allRoutes.filter(r=>r.city.toLowerCase().includes(q)||r.name.toLowerCase().includes(q));if(!matches.length){d.classList.remove('show');return;}d.innerHTML=matches.map(r=>'<div class="suggest-item" onmousedown="event.preventDefault();document.getElementById(\'routeSearch\').value=\''+r.city+'\';window.location.href=\''+targetUrl(r)+'\'">📍 '+r.city+' · '+r.name+'</div>').join('');d.classList.add('show');}
function renderRoutes(){let list=(activeFilter==='all'?allRoutes:allRoutes.filter(r=>r.tags.includes(activeFilter))).slice();if(activeSort==='days-asc')list.sort((a,b)=>a.days-b.days);if(activeSort==='budget-asc')list.sort((a,b)=>a.budget-b.budget);if(activeSort==='budget-desc')list.sort((a,b)=>b.budget-a.budget);const favs=JSON.parse(localStorage.getItem('tq_favs')||'[]');document.getElementById('routeCount').textContent='共 '+list.length+' 条路线 · loremflickr + picsum 双源图片';document.getElementById('routeGrid').innerHTML=list.map(r=>{const f=favs.includes(r.id);return '<article class="route-card"><a href="'+targetUrl(r)+'"><div class="rc-img" style="background:'+(grad[r.id]||grad.chengdu)+'">'+imgTag(r.id,r.seed)+'<span class="rc-badge">'+r.days+'天</span><div class="rc-city">'+r.city+'</div></div></a><div class="rc-body"><div class="rc-title">'+r.name+'</div><div class="rc-theme">'+r.theme+'</div><div class="rc-desc">'+r.desc+'</div><div class="rc-highlights">'+r.highlights.map(h=>'<span>'+h+'</span>').join('')+'</div><div class="rc-meta"><span>'+r.tags.join(' · ')+'</span><b>¥'+r.budget.toLocaleString()+'</b></div><div class="rc-actions"><button class="btn-use" onclick="location.href=\''+targetUrl(r)+'\'">一键套用</button><button class="btn-fav'+(f?' faved':'')+'" onclick="toggleFav(\''+r.id+'\',this)">'+(f?'♥ 已藏':'♡ 收藏')+'</button></div></div></article>';}).join('');}
function filterRoutes(tag,btn){activeFilter=tag;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderRoutes();}function sortRoutes(v){activeSort=v;renderRoutes();}function toggleFav(id,btn){let favs=JSON.parse(localStorage.getItem('tq_favs')||'[]');if(favs.includes(id)){favs=favs.filter(x=>x!==id);btn.textContent='♡ 收藏';btn.classList.remove('faved');showToast('已取消收藏');}else{favs.push(id);btn.textContent='♥ 已藏';btn.classList.add('faved');showToast('已收藏');}localStorage.setItem('tq_favs',JSON.stringify(favs));}function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}document.getElementById('themeBtn').addEventListener('click',()=>{const h=document.documentElement,n=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',n);document.getElementById('themeBtn').textContent=n==='dark'?'☀️':'🌓';localStorage.setItem('tq_theme',n);});(()=>{const t=localStorage.getItem('tq_theme');if(t){document.documentElement.setAttribute('data-theme',t);document.getElementById('themeBtn').textContent=t==='dark'?'☀️':'🌓';}})();renderRoutes();
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")</script>
</body>
</html>
