<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的行程 · TrailQuest</title>
<style>
:root{--bg:#fffaf3;--surface:#fff;--surface2:#fff3df;--border:#f2dfc4;--text:#23201d;--text2:#6f6254;--text3:#a89682;--accent:#ff7a1a;--accent2:#16a085;--accent-glow:rgba(255,122,26,.22);--scenic:#e67e22;--food:#c0392b;--culture:#8e44ad;--shop:#2c3e50;--night:#16a085;--shadow:0 8px 24px rgba(80,48,20,.08);--shadow-lg:0 18px 46px rgba(80,48,20,.14);--radius:16px;--radius-lg:18px;--radius-sm:10px;--nav-h:62px;--transition:180ms ease}
[data-theme="dark"]{--bg:#17120e;--surface:#211a14;--surface2:#2d2118;--border:#443326;--text:#fff7ed;--text2:#d7c5b3;--text3:#967d67;--accent-glow:rgba(255,122,26,.28);--shadow:0 8px 24px rgba(0,0,0,.28);--shadow-lg:0 18px 46px rgba(0,0,0,.38)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;transition:background var(--transition),color var(--transition)}
a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;z-index:100;height:var(--nav-h);background:rgba(255,250,243,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:28px}[data-theme="dark"] .nav{background:rgba(23,18,14,.88)}
.nav-logo{font-size:19px;font-weight:850;display:flex;align-items:center;gap:8px;letter-spacing:-.5px}.nav-logo span{color:var(--accent)}
.nav-links{display:flex;gap:4px;flex:1}
.nav-links a{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:650;color:var(--text2);transition:all var(--transition)}
.nav-links a:hover,.nav-links a:focus-visible{background:var(--surface2);color:var(--accent);outline:none}
.nav-links a.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px var(--accent-glow)}
.nav-actions{display:flex;gap:8px;align-items:center}
.nav-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all var(--transition);color:var(--text)}
.nav-btn:hover{background:var(--surface2);border-color:var(--text3);transform:scale(1.05)}
.banner{position:relative;height:140px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.banner::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#ff7a1a,#ffb347,#16a085);z-index:0}
.banner::after{content:'';position:absolute;width:40vw;height:40vw;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 60%);top:-5%;right:-5%;z-index:0}
.banner h1{position:relative;z-index:1;font-size:28px;font-weight:700;color:#fff;letter-spacing:-.5px}
.content{padding:32px 28px;flex:1;max-width:900px;margin:0 auto;width:100%}
.stats-bar{padding:0 0 20px;display:flex;gap:24px;font-size:13px;color:var(--text3);font-weight:500}
.stats-bar strong{color:var(--accent)}
.trip-grid{display:flex;flex-direction:column;gap:16px;margin-bottom:20px}
.trip-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;transition:all var(--transition);animation:fadeUp .4s ease-out backwards;box-shadow:var(--shadow)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.trip-card:hover{box-shadow:var(--shadow-lg);border-color:var(--accent);transform:translateY(-2px)}
.tc-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.tc-title{font-size:18px;font-weight:700;letter-spacing:-.3px}
.tc-city{font-size:13px;color:var(--accent);font-weight:500;margin-bottom:10px}
.tc-summary{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:14px}
.tc-summary .ds{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;margin:2px 4px 2px 0;background:var(--surface2);font-weight:500;color:var(--text2)}
.tc-meta{display:flex;gap:22px;font-size:12px;color:var(--text3);padding-top:14px;border-top:1px solid var(--border);margin-bottom:14px;font-weight:500}
.tc-meta span{display:flex;align-items:center;gap:4px}
.tc-actions{display:flex;gap:10px}
.tc-actions button{padding:9px 18px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;transition:all var(--transition);letter-spacing:-.2px}
.btn-view{background:var(--accent);color:#fff;border:none}.btn-view:hover{transform:translateY(-1px);box-shadow:0 4px 12px var(--accent-glow)}
.btn-delete{background:#fef2f2;color:var(--danger);border:1.5px solid #fecaca}.btn-delete:hover{background:#fee2e2}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--bg);border-radius:var(--radius-lg);padding:28px;max-width:400px;width:90%;box-shadow:var(--shadow-xl)}
.modal h3{font-size:18px;font-weight:700;margin-bottom:8px;letter-spacing:-.3px}
.modal p{font-size:14px;color:var(--text2);margin-bottom:22px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.modal-actions button{padding:9px 22px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:all var(--transition)}
.btn-cancel{background:var(--surface);color:var(--text2);border:1.5px solid var(--border)}.btn-cancel:hover{background:var(--surface2)}
.btn-confirm{background:var(--danger);color:#fff;border:none}.btn-confirm:hover{opacity:.9}

.empty-state{text-align:center;padding:80px 20px;animation:fadeUp .5s ease-out}
.empty-state .empty-icon{font-size:56px;margin-bottom:16px;opacity:.6}
.empty-state h3{font-size:18px;font-weight:600;margin-bottom:8px}
.empty-state p{font-size:14px;color:var(--text3);margin-bottom:20px}
.empty-state button{padding:10px 26px;border-radius:22px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all var(--transition)}
.empty-state button:hover{transform:translateY(-1px);box-shadow:0 4px 12px var(--accent-glow)}

.footer{padding:24px 28px;border-top:1px solid var(--border);text-align:center;font-size:12px;color:var(--text3);transition:border-color var(--transition)}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:12px 28px;border-radius:24px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);pointer-events:none;box-shadow:var(--shadow-xl)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent-glow);outline-offset:2px}
@media(max-width:900px){.nav{height:auto;min-height:var(--nav-h);padding:10px 16px;gap:12px;flex-wrap:wrap}.nav-actions{margin-left:auto}.nav-links{display:flex;overflow-x:auto;order:3;width:100%;padding-bottom:6px}.nav-links a{white-space:nowrap}.content{padding:20px 16px}}
</style>
</head>
<body>
<nav class="nav"><a href="index.html" class="nav-logo">📍 <span>TrailQuest</span></a><div class="nav-links"><a href="index.html">首页</a><a href="planner.html">行程规划</a><a href="routes.html">热门路线</a><a href="dashboard.html">仪表盘</a><a href="my-trips.html" class="active">我的行程</a></div><div class="nav-actions"><button class="nav-btn" id="themeBtn">🌓</button></div></nav>
<div class="banner"><h1>💾 我的行程</h1><div style="display:flex;gap:8px;align-items:center;position:relative;z-index:1;margin-top:10px"><input type="text" id="tripSearch" placeholder="搜索行程..." autocomplete="off" oninput="buildPage()" style="padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff;font-size:13px;width:180px;outline:none"><select id="tripSort" onchange="buildPage()" style="padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff;font-size:13px;outline:none"><option value="newest">最新</option><option value="oldest">最早</option><option value="budget-desc">预算高→低</option><option value="budget-asc">预算低→高</option><option value="days-desc">天数多→少</option></select></div></div>
<div class="content" id="contentArea"></div>
<div class="footer">&copy; 2026 TrailQuest</div>

<div class="modal-overlay" id="deleteModal"><div class="modal"><h3>⚠️ 确认删除</h3><p>确定要删除这条行程吗？此操作不可恢复。</p><div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn-confirm" id="confirmDeleteBtn">确认删除</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
let deleteTarget=null;
function buildPage(){
  const trips=JSON.parse(localStorage.getItem('tq_trips')||'[]'),area=document.getElementById('contentArea');
  const newBtn='<div class="stats-bar" style="justify-content:space-between;margin-bottom:16px"><span>'+trips.length+' 条行程</span><div style="display:flex;gap:8px"><a href="dashboard.html" style="padding:8px 16px;border-radius:999px;border:2px solid var(--accent);color:var(--accent);font-size:13px;font-weight:700">📊 仪表盘</a><button style="padding:8px 20px;border-radius:999px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:700;cursor:pointer" onclick="location.href=\'planner.html\'">+ 新建行程</button></div></div>';
  if(!trips.length){area.innerHTML=newBtn+'<div class="empty-state"><div class="empty-icon">📋</div><h3>还没有保存行程</h3><p>点击上方按钮或前往规划页创建行程</p><button onclick="location.href=\'planner.html\'">✈️ 开始规划行程</button></div>';return;}
  const totalPois=trips.reduce((s,t)=>s+(t.dayPlan?t.dayPlan.reduce((ss,d)=>ss+(d.pois?d.pois.length:0),0):0),0);
  const totalBudget=trips.reduce((s,t)=>s+(Number(t.totalBudget)||0),0);
  area.innerHTML=newBtn+'<div class="trip-grid">'+trips.map((t,i)=>'<div class="trip-card" style="animation-delay:'+(i*0.08)+'s"><div class="tc-header"><div class="tc-title">'+(t.name||'未命名行程')+'</div></div><div class="tc-city">📍 '+(t.city||'自定义')+'</div><div class="tc-summary">'+(t.dayPlan?t.dayPlan.map(d=>'<span class="ds">'+(d.label||'DAY')+' · '+(d.pois?d.pois.length:0)+'个点</span>').join(''):'')+'</div><div class="tc-meta"><span>📅 '+(t.days||(t.dayPlan?t.dayPlan.length:1))+' 天</span><span>📍 '+(t.dayPlan?t.dayPlan.reduce((s,d)=>s+(d.pois?d.pois.length:0),0):0)+' 个打卡点</span><span>💰 ¥'+(Number(t.totalBudget)||0).toLocaleString()+'</span></div><div class="tc-actions"><button class="btn-view" onclick="location.href=\'planner.html?trip='+i+'\'">👁️ 查看详情</button><button class="btn-delete" onclick="confirmDelete('+i+')">🗑️ 删除</button></div></div>').join('')+'</div>';
}
function confirmDelete(idx){deleteTarget=idx;document.getElementById('deleteModal').classList.add('show');}
function closeModal(){document.getElementById('deleteModal').classList.remove('show');deleteTarget=null;}
document.getElementById('confirmDeleteBtn').addEventListener('click',function(){if(deleteTarget===null)return;let trips=JSON.parse(localStorage.getItem('tq_trips')||'[]');trips.splice(deleteTarget,1);localStorage.setItem('tq_trips',JSON.stringify(trips));closeModal();buildPage();showToast('行程已删除');});
document.getElementById('deleteModal').addEventListener('click',function(e){if(e.target===this)closeModal();});
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
document.getElementById('themeBtn').addEventListener('click',function(){const h=document.documentElement,c=h.getAttribute('data-theme'),n=c==='dark'?'light':'dark';h.setAttribute('data-theme',n);document.getElementById('themeBtn').textContent=n==='dark'?'☀️':'🌓';localStorage.setItem('tq_theme',n);});
(function(){const t=localStorage.getItem('tq_theme');if(t){document.documentElement.setAttribute('data-theme',t);document.getElementById('themeBtn').textContent=t==='dark'?'☀️':'🌓';}})();
buildPage();
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")</script>
</body>
</html>
