<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仪表盘 · TrailQuest</title>
<style>
:root{--bg:#fff;--surface:#f8fafc;--surface2:#f1f5f9;--border:#e2e8f0;--text:#0f172a;--text2:#475569;--text3:#94a3b8;--accent:#0284c7;--accent-glow:rgba(2,132,199,.2);--scenic:#3B82F6;--food:#F59E0B;--culture:#8B5CF6;--shop:#EC4899;--night:#10B981;--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lg:0 10px 25px rgba(0,0,0,.08);--radius:12px;--radius-sm:8px;--nav-h:60px;--transition:200ms cubic-bezier(.4,0,.2,1)}
[data-theme="dark"]{--bg:#0b1120;--surface:#111827;--surface2:#1e293b;--border:#1e293b;--text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;--accent-glow:rgba(2,132,199,.25);--shadow:0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 10px 25px rgba(0,0,0,.4)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;transition:background var(--transition),color var(--transition)}
a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;z-index:100;height:var(--nav-h);background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:32px;transition:background var(--transition),border-color var(--transition);backdrop-filter:blur(16px)}
.nav-logo{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:-.3px}
.nav-logo span{background:linear-gradient(135deg,var(--accent),#0ea5e9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav-links{display:flex;gap:2px;flex:1}
.nav-links a{padding:8px 16px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:500;color:var(--text2);transition:all var(--transition)}
.nav-links a:hover{background:var(--surface2);color:var(--text)}
.nav-links a.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px var(--accent-glow)}
.nav-actions{display:flex;gap:8px;align-items:center}
.nav-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all var(--transition);color:var(--text)}
.nav-btn:hover{background:var(--surface2);border-color:var(--text3);transform:scale(1.05)}
.banner{position:relative;height:140px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.banner::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#0c4a6e,#0369a1,#0284c7);z-index:0}
.banner::after{content:'';position:absolute;width:40vw;height:40vw;border-radius:50%;background:radial-gradient(circle,rgba(14,165,233,.2),transparent 60%);top:-10%;left:-5%;z-index:0}
.banner h1{position:relative;z-index:1;font-size:28px;font-weight:700;color:#fff;letter-spacing:-.5px}
.content{padding:32px 28px;flex:1;max-width:1000px;margin:0 auto;width:100%}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:32px;animation:fadeUp .5s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all var(--transition)}
.stat-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.stat-card .slabel{font-size:11px;color:var(--text3);font-weight:600;letter-spacing:.5px;margin-bottom:8px}
.stat-card .sval{font-size:34px;font-weight:800;color:var(--text);line-height:1;letter-spacing:-1px}
.stat-card .ssub{font-size:12px;color:var(--text2);margin-top:6px}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:24px;margin-bottom:32px}
.chart-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:24px;transition:all var(--transition)}
.chart-card h3{font-size:15px;font-weight:600;margin-bottom:20px;letter-spacing:-.2px}
.chart-bar-group{margin-bottom:16px}.chart-bar-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.chart-bar-label .val{font-weight:600}
.chart-bar-track{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.chart-bar-fill{height:100%;border-radius:5px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.cb-scenic{background:var(--scenic)}.cb-food{background:var(--food)}.cb-culture{background:var(--culture)}.cb-shop{background:var(--shop)}.cb-night{background:var(--night)}
.pie-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}.pie-legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)}
.pie-dot{width:10px;height:10px;border-radius:50%}.pd-scenic{background:var(--scenic)}.pd-food{background:var(--food)}.pd-culture{background:var(--culture)}.pd-shop{background:var(--shop)}.pd-night{background:var(--night)}
.trip-row{display:flex;align-items:center;gap:16px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;transition:all var(--transition)}
.trip-row:hover{border-color:var(--accent)}.trip-row .day-badge{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;background:var(--accent);flex-shrink:0}
.trip-row .trip-name{font-size:14px;font-weight:600;flex:1}.trip-row .trip-pois{font-size:12px;color:var(--text3)}.trip-row .trip-cost{font-size:14px;font-weight:700;color:var(--food)}
.empty-state{text-align:center;padding:80px 20px;animation:fadeUp .5s ease-out}
.empty-state .empty-icon{font-size:56px;margin-bottom:16px;opacity:.6}
.empty-state h3{font-size:18px;font-weight:600;margin-bottom:8px}
.empty-state p{font-size:14px;color:var(--text3);margin-bottom:20px}
.empty-state button{padding:10px 26px;border-radius:22px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all var(--transition)}
.empty-state button:hover{transform:translateY(-1px);box-shadow:0 4px 12px var(--accent-glow)}
.footer{padding:24px 28px;border-top:1px solid var(--border);text-align:center;font-size:12px;color:var(--text3);transition:border-color var(--transition)}
@media(max-width:900px){.nav{padding:0 16px;gap:16px}.nav-links{display:none}.content{padding:20px 16px}.chart-grid{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<nav class="nav"><a href="index.html" class="nav-logo">📍 <span>TrailQuest</span></a><div class="nav-links"><a href="index.html">首页</a><a href="planner.html">行程规划</a><a href="routes.html">热门路线</a><a href="explore.html">周边探索</a><a href="dashboard.html" class="active">仪表盘</a><a href="my-trips.html">我的行程</a></div><div class="nav-actions"><button class="nav-btn" id="themeBtn">🌓</button></div></nav>
<div class="banner"><h1>📊 行程仪表盘</h1></div>
<div class="content" id="dashContent"></div><div class="footer">&copy; 2026 TrailQuest</div>

<script>
(function buildDashboard(){
  const trips=JSON.parse(localStorage.getItem('tq_trips')||'[]');
  if(!trips.length){document.getElementById('dashContent').innerHTML='<div class="empty-state"><div class="empty-icon">📊</div><h3>暂无行程数据</h3><p>去规划并保存一条行程，这里将展示详细的统计分析</p><button onclick="location.href=\'planner.html\'">✈️ 开始规划</button></div>';return;}
  const t=trips[0];let allPois=[],totalCost=0,totalDur=0;
  t.dayPlan.forEach(d=>d.pois.forEach(p=>{allPois.push(p);totalCost+=p.cost;totalDur+=p.dur;}));
  const counts={scenic:0,food:0,culture:0,shop:0,night:0},costs={scenic:0,food:0,culture:0,shop:0,night:0};
  allPois.forEach(p=>{counts[p.cat]=(counts[p.cat]||0)+1;costs[p.cat]=(costs[p.cat]||0)+p.cost;});
  document.getElementById('dashContent').innerHTML=
    '<div class="stat-grid"><div class="stat-card"><div class="slabel">总天数</div><div class="sval">'+t.days+'</div><div class="ssub">'+t.dayPlan.map(d=>d.label.split('·')[1]||'').join(' / ')+'</div></div><div class="stat-card"><div class="slabel">打卡点</div><div class="sval">'+allPois.length+'</div><div class="ssub">日均 '+(allPois.length/t.days).toFixed(1)+' 个</div></div><div class="stat-card"><div class="slabel">总预算</div><div class="sval" style="color:var(--food)">¥'+t.totalBudget.toLocaleString()+'</div><div class="ssub">人均 ¥'+t.totalBudget.toLocaleString()+'</div></div><div class="stat-card"><div class="slabel">总时长</div><div class="sval" style="color:var(--accent)">'+(totalDur/60).toFixed(0)+'h</div><div class="ssub">日均 '+(totalDur/60/t.days).toFixed(1)+' 小时</div></div></div>'+
    '<div class="chart-grid">'+
    '<div class="chart-card"><h3>POI 分类分布</h3>'+Object.entries(counts).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).map(e=>{const pct=Math.round(e[1]/allPois.length*100);return '<div class="chart-bar-group"><div class="chart-bar-label"><span>'+e[0]+'</span><span class="val">'+e[1]+' ('+pct+'%)</span></div><div class="chart-bar-track"><div class="chart-bar-fill cb-'+e[0]+'" style="width:'+pct+'%"></div></div></div>';}).join('')+'<div class="pie-legend">'+Object.entries(counts).filter(e=>e[1]>0).map(e=>'<div class="pie-legend-item"><div class="pie-dot pd-'+e[0]+'"></div>'+e[0]+' · '+e[1]+'个</div>').join('')+'</div></div>'+
    '<div class="chart-card"><h3>预算构成</h3>'+Object.entries(costs).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).map(e=>{const pct=Math.round(e[1]/totalCost*100);return '<div class="chart-bar-group"><div class="chart-bar-label"><span>'+e[0]+'</span><span class="val">¥'+e[1]+' ('+pct+'%)</span></div><div class="chart-bar-track"><div class="chart-bar-fill cb-'+e[0]+'" style="width:'+pct+'%"></div></div></div>';}).join('')+'<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:14px"><span>合计</span><span style="font-weight:700;color:var(--food)">¥'+totalCost.toLocaleString()+'</span></div></div></div>'+
    '<div class="chart-card"><h3>每日安排</h3>'+t.dayPlan.map(d=>'<div class="trip-row"><div class="day-badge">'+d.day+'</div><div class="trip-name">'+d.label+'</div><div class="trip-pois">'+d.pois.length+' 个打卡点</div><div class="trip-cost">¥'+d.pois.reduce((s,p)=>s+p.cost,0)+'</div></div>').join('')+'</div>';
})();
document.getElementById('themeBtn').addEventListener('click',function(){const h=document.documentElement,c=h.getAttribute('data-theme'),n=c==='dark'?'light':'dark';h.setAttribute('data-theme',n);document.getElementById('themeBtn').textContent=n==='dark'?'☀️':'🌓';localStorage.setItem('tq_theme',n);});
(function(){const t=localStorage.getItem('tq_theme');if(t){document.documentElement.setAttribute('data-theme',t);document.getElementById('themeBtn').textContent=t==='dark'?'☀️':'🌓';}})();
</script>
</body>
</html>
