<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrailQuest · 轻量旅行路线规划</title>
<style>
:root{--bg:#fffaf3;--surface:#fff;--surface2:#fff3df;--border:#f2dfc4;--text:#23201d;--text2:#6f6254;--text3:#a89682;--accent:#ff7a1a;--accent2:#16a085;--accent-glow:rgba(255,122,26,.22);--shadow:0 8px 24px rgba(80,48,20,.08);--shadow-lg:0 18px 46px rgba(80,48,20,.14);--radius:18px;--radius-sm:12px;--nav-h:62px;--transition:180ms ease}
[data-theme="dark"]{--bg:#17120e;--surface:#211a14;--surface2:#2d2118;--border:#443326;--text:#fff7ed;--text2:#d7c5b3;--text3:#967d67;--accent-glow:rgba(255,122,26,.28);--shadow:0 8px 24px rgba(0,0,0,.28);--shadow-lg:0 18px 46px rgba(0,0,0,.38)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}a{text-decoration:none;color:inherit}.nav{position:sticky;top:0;z-index:20;height:var(--nav-h);display:flex;align-items:center;gap:28px;padding:0 28px;background:rgba(255,250,243,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}[data-theme="dark"] .nav{background:rgba(23,18,14,.88)}.nav-logo{font-size:19px;font-weight:850;letter-spacing:-.5px}.nav-logo span{color:var(--accent)}.nav-links{display:flex;gap:4px;flex:1}.nav-links a{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:650;color:var(--text2);transition:all var(--transition)}.nav-links a:hover,.nav-links a.active{background:var(--surface2);color:var(--accent)}.nav-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer}.hero{max-width:1180px;margin:0 auto;padding:46px 24px 22px;text-align:center}.hero-kicker{display:inline-flex;gap:8px;align-items:center;padding:7px 13px;border-radius:999px;background:var(--surface2);color:var(--accent);font-size:13px;font-weight:800;margin-bottom:14px}.hero h1{font-size:54px;line-height:1.06;letter-spacing:-2px;font-weight:900}.hero h1 strong{color:var(--accent)}.hero p{font-size:17px;color:var(--text2);margin:18px auto 26px;max-width:620px}.search-wrap{position:relative;max-width:610px;margin:0 auto}.search-box{display:flex;gap:10px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;box-shadow:var(--shadow)}.search-box input{flex:1;border:0;background:transparent;padding:0 16px;font-size:15px;color:var(--text);outline:none}.search-box button{border:0;border-radius:999px;background:var(--accent);color:#fff;padding:13px 24px;font-weight:850;cursor:pointer;box-shadow:0 10px 20px var(--accent-glow);transition:all var(--transition)}.search-box button:hover{transform:translateY(-1px)}.suggest-dropdown{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);z-index:30;max-height:260px;overflow-y:auto;padding:6px}.suggest-dropdown.show{display:block}.suggest-item{padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:8px;transition:background var(--transition)}.suggest-item:hover,.suggest-item.active{background:var(--surface2);color:var(--accent)}.suggest-item span{font-size:12px;color:var(--text3);font-weight:500}.hero-tags{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.hero-tags button{border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer}.hero-visual{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:420px}.photo-tile{position:relative;overflow:hidden;border-radius:28px;box-shadow:var(--shadow-lg);min-height:190px;display:flex;align-items:flex-end}
.section{max-width:1180px;margin:0 auto;padding:34px 24px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}.section-title{font-size:26px;font-weight:900;letter-spacing:-.6px}.section-sub{color:var(--text3);font-size:14px}.section-link{font-size:13px;color:var(--accent);font-weight:850}.route-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.route-card{background:var(--surface);border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);transition:all var(--transition)}.route-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}.route-img{height:150px;position:relative;overflow:hidden;display:flex;align-items:flex-end}
.route-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:0;transition:opacity .4s ease}.route-img img.loaded{opacity:1}.route-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.42));z-index:1}.route-badge{position:absolute;left:12px;top:12px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.92);font-size:11px;font-weight:850;color:#1f2937;z-index:2}.route-city{position:relative;z-index:2;padding:14px;color:#fff;font-size:20px;font-weight:900}.route-body{padding:14px}.route-name{font-size:15px;font-weight:850;margin-bottom:5px}.route-info{font-size:12px;color:var(--text2);min-height:38px}.route-meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--text3);font-weight:750}.route-meta b{color:var(--accent)}.action-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.action-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow);transition:all var(--transition)}.action-card:hover{transform:translateY(-2px);border-color:var(--accent)}.action-card h3{font-size:15px;margin-bottom:5px}.action-card p{font-size:12px;color:var(--text3)}.footer{text-align:center;padding:28px;color:var(--text3);font-size:12px;border-top:1px solid var(--border);margin-top:24px}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(18px);opacity:0;background:var(--text);color:var(--bg);padding:11px 22px;border-radius:999px;font-size:13px;font-weight:800;transition:all .25s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent-glow);outline-offset:2px}@media(max-width:980px){.nav{height:auto;min-height:var(--nav-h);padding:10px 16px;flex-wrap:wrap}.nav-links{order:3;width:100%;overflow-x:auto}.hero{padding-top:28px}.hero h1{font-size:38px}.route-grid,.action-row{grid-template-columns:1fr 1fr}}@media(max-width:620px){.search-box{border-radius:22px;flex-direction:column;padding:10px}.search-box input{height:42px}.route-grid,.action-row{grid-template-columns:1fr}.hero-visual{grid-template-columns:1fr}.photo-tile:first-child{grid-row:auto}.section-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<nav class="nav"><a href="index.html" class="nav-logo">Trail<span>Quest</span></a><div class="nav-links"><a href="index.html" class="active">首页</a><a href="planner.html">行程规划</a><a href="routes.html">热门路线</a><a href="dashboard.html">仪表盘</a><a href="my-trips.html">我的行程</a></div><button class="nav-btn" id="themeBtn">🌓</button></nav>
<main>
<section class="hero">
  <div><div class="hero-kicker">12条热门路线 · 6座城市内置POI · 自定义规划</div><h1>找到一条<strong>真正想出发</strong>的路线</h1><p>用热门目的地启发灵感，也可以输入任意城市、景区或路线关键词，直接生成可保存、可统计、可地图查看的旅行计划。</p><div class="search-wrap"><div class="search-box"><input id="heroSearch" placeholder="输入目的地，如：成都美食、川西小环线、苏州周末游" autocomplete="off" oninput="showHeroSuggest(this.value)" onkeydown="if(event.key==='Enter'){hideHeroSuggest();goSearch();}" onfocus="showHeroSuggest(this.value)" onblur="setTimeout(hideHeroSuggest,200)"><button onclick="goSearch()">开始规划</button></div><div class="suggest-dropdown" id="heroSuggest"></div></div><div class="hero-tags" id="heroTags"></div></div>
</section>
<section class="section"><div class="section-head"><div><div class="section-title">热门路线</div><div class="section-sub">loremflickr → picsum → 渐变三级兜底</div></div><a class="section-link" href="routes.html">查看全部路线 →</a></div><div class="route-grid" id="routeGrid"></div></section>
<section class="section"><div class="section-head"><div><div class="section-title">快速开始</div><div class="section-sub">首页到各子页面的快捷入口</div></div></div><div class="action-row"><a class="action-card" href="planner.html"><h3>自由规划</h3><p>输入目的地、天数、偏好与预算</p></a><a class="action-card" href="routes.html"><h3>路线模板</h3><p>从热门路线一键套用</p></a><a class="action-card" href="my-trips.html"><h3>我的行程</h3><p>恢复已保存的规划记录</p></a></div></section>
</main>
<div class="footer">&copy; 2026 TrailQuest · loremflickr + picsum 多源图片</div><div class="toast" id="toast"></div>
<script>
const grad={chengdu:'linear-gradient(135deg,#e74c3c,#f39c12)',xian:'linear-gradient(135deg,#c0392b,#d35400)',beijing:'linear-gradient(135deg,#c0392b,#f1c40f)',hangzhou:'linear-gradient(135deg,#27ae60,#1abc9c)',chongqing:'linear-gradient(135deg,#2c3e50,#e74c3c)',dali:'linear-gradient(135deg,#2980b9,#1abc9c)',guangzhou:'linear-gradient(135deg,#e67e22,#f1c40f)',xiamen:'linear-gradient(135deg,#3498db,#2ecc71)',suzhou:'linear-gradient(135deg,#27ae60,#16a085)',guilin:'linear-gradient(135deg,#1abc9c,#2ecc71)',qinghaihu:'linear-gradient(135deg,#2980b9,#9b59b6)',chuanxi:'linear-gradient(135deg,#8e44ad,#2980b9)'};
const routes=[{id:'chengdu',city:'成都',name:'天府3日烟火游',days:3,budget:3500,tags:'美食·文化',seed:'chengdu2'},{id:'xian',city:'西安',name:'古都4日探秘',days:4,budget:4200,tags:'历史·古迹',seed:'xian2'},{id:'beijing',city:'北京',name:'皇城3日精华',days:3,budget:3800,tags:'故宫·长城',seed:'beijing2'},{id:'hangzhou',city:'杭州',name:'西湖3日慢游',days:3,budget:3000,tags:'湖景·茶园',seed:'hangzhou2'},{id:'chongqing',city:'重庆',name:'山城3日夜景',days:3,budget:2800,tags:'火锅·夜景',seed:'chongqing2'},{id:'dali',city:'大理',name:'洱海4日松弛游',days:4,budget:3800,tags:'自然·古城',seed:'dali2'},{id:'guangzhou',city:'广州',name:'广府3日美食线',days:3,budget:2600,tags:'早茶·骑楼',seed:'guangzhou2'},{id:'xiamen',city:'厦门',name:'海岛3日文艺游',days:3,budget:3200,tags:'海岛·街区',seed:'xiamen2'}];
const imgTag=(id,seed)=>'<img loading="lazy" src="https://picsum.photos/seed/'+seed+'/640/420" alt="" onerror="this.onerror=null;this.src=\'https://loremflickr.com/640/420/'+id+',travel,china\';" onload="this.classList.add(\'loaded\')">';
const imgSrc=(id,seed)=>'https://picsum.photos/seed/'+seed+'/720/460';
const imgSrcFb=(id)=>'https://loremflickr.com/720/460/'+id+',travel,china';
document.getElementById('heroTags').innerHTML=routes.slice(0,8).map(r=>'<button onclick="goQuick(\''+r.id+'\')">'+r.city+'</button>').join('');
document.getElementById('routeGrid').innerHTML=routes.map(r=>'<a class="route-card" href="planner.html?city='+encodeURIComponent(r.id)+'"><div class="route-img" style="background:'+(grad[r.id]||grad.chengdu)+'">'+imgTag(r.id,r.seed)+'<span class="route-badge">'+r.tags+'</span><div class="route-city">'+r.city+'</div></div><div class="route-body"><div class="route-name">'+r.name+'</div><div class="route-info">'+r.days+'天行程模板，可进入规划页继续编辑、保存和统计。</div><div class="route-meta"><span>'+r.days+' 天</span><b>¥'+r.budget.toLocaleString()+'</b></div></div></a>').join('');
function goSearch(){hideHeroSuggest();const q=document.getElementById('heroSearch').value.trim();if(!q){showToast('请输入目的地或路线关键词');return;}window.location.href='planner.html?q='+encodeURIComponent(q);}function goQuick(id){window.location.href='planner.html?city='+encodeURIComponent(id);}
const keywords=['成都美食','成都火锅','川西小环线','川西自驾','西安兵马俑','西安三日游','北京故宫','北京长城','杭州西湖','杭州灵隐寺','重庆洪崖洞','重庆火锅','大理洱海','大理古城','广州早茶','广州沙面','厦门鼓浪屿','厦门环岛路','苏州园林','苏州拙政园','桂林漓江','桂林阳朔','青海湖环湖','青海湖骑行','上海外滩','南京夫子庙','武汉黄鹤楼','长沙橘子洲','三亚海岛','丽江古城','拉萨布达拉宫','敦煌莫高窟','洛阳龙门石窟','张家界天门山','九寨沟','黄山宏村','青岛海滨','哈尔滨冰雪','长白山天池','贵州黄果树'];
function showHeroSuggest(v){const d=document.getElementById('heroSuggest');if(!v){d.classList.remove('show');d.innerHTML='';return;}const q=v.trim().toLowerCase();const matches=keywords.filter(k=>k.toLowerCase().includes(q)).slice(0,8);if(!matches.length){d.classList.remove('show');return;}d.innerHTML=matches.map(k=>'<div class="suggest-item" onmousedown="event.preventDefault();document.getElementById(\'heroSearch\').value=\''+k+'\';hideHeroSuggest();goSearch();">📍 '+k+'</div>').join('');d.classList.add('show');}function hideHeroSuggest(){document.getElementById('heroSuggest').classList.remove('show');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}document.getElementById('themeBtn').addEventListener('click',()=>{const h=document.documentElement,n=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',n);document.getElementById('themeBtn').textContent=n==='dark'?'☀️':'🌓';localStorage.setItem('tq_theme',n);});(()=>{const t=localStorage.getItem('tq_theme');if(t){document.documentElement.setAttribute('data-theme',t);document.getElementById('themeBtn').textContent=t==='dark'?'☀️':'🌓';}})();
// hero image fallback - if both img sources fail, show gradient

</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")</script>
</body>
</html>
